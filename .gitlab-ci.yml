stages:
  - update

update:
  image: node:20.13.1
  stage: update
  only:
    - dev
  tags:
    - k8s
  before_script:
    - echo "${UPDATER_ENV}" | tr -d '\r' > .env
    - npm install
    - npm run lint
  script:
    - npm run update
    - npm run publish
  artifacts:
    expire_in: 1 month
    paths:
      - artifacts
      - resources/config.json